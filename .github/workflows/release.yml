name: Build Minimal-Privilege Desktop EXE & Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Strict read-only default
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Single-File EXE
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compile BF6WeaponHub.exe & Run In-Memory Self-Test
        shell: pwsh
        run: ./desktop-win/build.ps1

      - name: Verify asInvoker Manifest (No Admin Elevation)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllText("desktop-win/app.manifest")
          if ($bytes -notmatch 'level="asInvoker"') { throw "Manifest must enforce asInvoker!" }

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BF6WeaponHub-Windows-x64
          path: dist/BF6WeaponHub.exe

  build-android:
    name: Build Zero-Permission Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Release APK
        working-directory: mobile-android
        run: gradle assembleRelease --no-daemon

      - name: Security Gate — Verify ZERO Permissions in Compiled APK
        run: |
          APK_PATH="mobile-android/app/build/outputs/apk/release/app-release.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          PERMS=$("$APKANALYZER" manifest permissions "$APK_PATH" || true)
          echo "Detected APK permissions: '${PERMS}'"
          if [ -n "$PERMS" ]; then
            echo "ERROR: APK must request ZERO permissions!"
            exit 1
          fi
          cp "$APK_PATH" BF6WeaponHub-Android-ZeroPerm.apk

      - name: Package Offline Mobile PWA Zip
        run: |
          cd mobile-pwa && zip -r ../BF6WeaponHub-MobilePWA-Offline.zip .

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BF6WeaponHub-Mobile
          path: |
            BF6WeaponHub-Android-ZeroPerm.apk
            BF6WeaponHub-MobilePWA-Offline.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/BF6WeaponHub.exe
            release-files/BF6WeaponHub-Android-ZeroPerm.apk
            release-files/BF6WeaponHub-MobilePWA-Offline.zip
            release-files/SHA256SUMS.txt
