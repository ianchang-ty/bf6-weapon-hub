name: Deploy Mobile PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Minimal default token permissions
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile-pwa static bundle only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./mobile-pwa"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
